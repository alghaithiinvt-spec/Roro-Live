<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق بث مباشر تفاعلي</title>
    <style>
        body {
            margin: 0;
            background-color: #0f0f0f;
            font-family: Tahoma, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .phone-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background: #18181b;
            border-radius: 30px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            z-index: 10;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #ec4899;
        }
        .video-area {
            flex: 1;
            background: linear-gradient(135deg, #27272a, #09090b);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .live-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #ef4444;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .viewer-count {
            position: absolute;
            top: 15px;
            left: 80px;
            background: rgba(0,0,0,0.5);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
        .chat-box {
            position: absolute;
            bottom: 70px;
            left: 15px;
            right: 15px;
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scroll-behavior: smooth;
        }
        .chat-message {
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            width: fit-content;
            max-width: 80%;
            word-wrap: break-word;
        }
        .interactive-bar {
            position: absolute;
            bottom: 10px;
            left: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .chat-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #3f3f46;
            padding: 10px 15px;
            border-radius: 25px;
            color: white;
            outline: none;
            font-size: 13px;
        }
        .action-btn {
            background: #27272a;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: 0.2s;
        }
        .action-btn:hover {
            background: #3f3f46;
        }
        .footer-nav {
            height: 60px;
            background: #121214;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #27272a;
            z-index: 10;
        }
        .nav-item {
            font-size: 11px;
            color: #a1a1aa;
            text-align: center;
            cursor: pointer;
        }
        .nav-item.active {
            color: #ec4899;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- الهيدر العلوي -->
        <div class="header">
            <span>🔔</span>
            <div class="logo">رورو</div>
            <span>🔍</span>
        </div>

        <!-- منطقة البث المباشر -->
        <div class="video-area">
            <div class="live-badge">LIVE 🔴</div>
            <div class="viewer-count">👁️ <span id="viewCount">1,240</span></div>
            
            <!-- التعليقات الوهمية والمتفاعلة -->
            <div class="chat-box" id="chatBox">
                <div class="chat-message"><b>أحمد:</b> جميلة جداً ❤️</div>
                <div class="chat-message"><b>سعيد:</b> ممكن نتعرف؟ ❤️</div>
                <div class="chat-message"><b>خالد:</b> ما شاء الله ❤️</div>
            </div>
        </div>

        <!-- شريط التفاعل وإرسال التعليقات -->
        <div class="interactive-bar">
            <input type="text" id="messageInput" class="chat-input" placeholder="اكتب رسالة..." onkeypress="handleKeyPress(event)">
            <button class="action-btn" onclick="sendMessage()" title="إرسال">💬</button>
            <button class="action-btn" onclick="sendLike()" title="إعجاب">❤️</button>
        </div>

        <!-- الشريط السفلي للتنقل -->
        <div class="footer-nav">
            <div class="nav-item active">الرئيسية</div>
            <div class="nav-item">اكتشف</div>
            <div class="nav-item" style="color: #ec4899; font-weight: bold;">➕ بث</div>
            <div class="nav-item">الرسائل</div>
            <div class="nav-item">الملف الشخصي</div>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const chatBox = document.getElementById('chatBox');
            
            if (input.value.trim() !== '') {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'chat-message';
                messageDiv.innerHTML = `<b>أنت:</b> ${input.value}`;
                chatBox.appendChild(messageDiv);
                
                input.value = '';
                chatBox.scrollTop = chatBox.scrollHeight; // التمرير للأسفل تلقائياً
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendLike() {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'chat-message';
            messageDiv.style.background = 'rgba(236, 72, 153, 0.3)';
            messageDiv.innerHTML = `❤️ أرسلت إعجاباً للبث!`;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>

</body>
</html>
